# deploy/openclaw/tool-policy.yaml —— 命令面（配置即代码，批 G-II）
#
# 覆盖：/card 命令怎么被 OpenClaw 识别成对 card 技能的调用。
# 不覆盖：技能本身干什么（那在 skills/card/SKILL.md + scripts/inbound.py）。
#
# 🔴 敏感值一律不落这里
# --------------------
# 飞书 appId / appSecret、gateway token、owner 白名单（真实 open_id）都不在这个文件
# 里 —— 它们是可识别的个人信息 / 凭据，属于仓库外的 live 配置
# （~/.openclaw-biga/openclaw.json）。apply_config.py **只增量合并它管的这几个键**，
# 绝不覆盖那些 live 值（`config patch` 递归合并，不碰没提到的键）。
#
# 🔴 为什么是「skill + shell 跑脚本」而不是 MCP 工具
# --------------------------------------------------
# BigA 全仓的技能都是同一个形态：SKILL.md 写一条 `python3 .../script.py`，agent 读了
# 技能就用 shell 跑那个脚本（decision-card / 各 *-calc / news-scan / risk-check）。出卡
# 触发照此办理：main 认出出卡请求 → 跑 skills/card/scripts/inbound.py。曾为了让
# command-dispatch 直达而引入过一个 MCP server，但 command-dispatch 够不到会话内按需
# 连接的 MCP 工具（P6 live 实测），且 MCP 与全仓 skill 形态不一致 —— 已整体移除。
# 要防的 L-14 递归靠「inbound.py 把编排脱离 main 进程树」挡，不靠工具形态。

commands:
  # 飞书没有原生斜杠菜单，/card 作为**纯文本命令**发（channels/feishu.md）。
  # text:true 让命令层解析 /card、识别成对 card 技能的调用。
  text: true
