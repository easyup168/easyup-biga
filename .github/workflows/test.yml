name: test

on:
  push:
  pull_request:

jobs:
  hermetic:
    # 默认测试套件：只跑不依赖本机环境的测试（无 OpenClaw profile / bin/biga / .git）。
    # 目标：clean clone 里 pytest 0 failed 0 error。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 🔴 3.12 是**声明支持**的版本（pyproject 的 requires-python）；
        #    3.13 是提前探路（评审 N4）。fail-fast: false —— 3.13 红了不该
        #    挡住 3.12 的结论，否则「支持的那个版本到底行不行」查不出来。
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . --no-build-isolation

      - name: Compile check
        run: python -m compileall -q src skills tools

      - name: Bash syntax check
        run: bash -n bin/biga bin/biga-card bin/biga-notify

      - name: Hermetic tests
        # -m "not installed and not live and not git" 跳过所有环境依赖测试。
        # 🔴 timeout-minutes：套件里有几条起真子进程的测试（出卡沙盒、通知并发）。
        #    它们卡住时默认会耗满 job 的 6 小时上限 —— 一次挂死等于烧掉一整天的
        #    CI 额度，而且看起来像「还在跑」，没人会去点停止。
        timeout-minutes: 15
        run: pytest -q -m "not installed and not live and not git"

  source-archive:
    # 模拟 source ZIP 场景（无 .git）。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Simulate source archive without .git
        run: |
          cp -a . /tmp/biga-source
          rm -rf /tmp/biga-source/.git

      - name: Install and test in archive
        timeout-minutes: 15
        working-directory: /tmp/biga-source
        run: |
          python -m pip install -U pip
          python -m pip install -e . --no-build-isolation
          pytest -q -m "not installed and not live and not git"
