# ─────────────────────────────────────────────────────────── 打包（批 U-II）
#
# 在此之前本文件**只有** [tool.pytest.ini_options] —— `pip install -e .` 这条
# 外部评审 F 节的验收标准必然失败。批 U-II 补上 [build-system] + [project]。
#
# 🔴 本批刻意不删除、不修改任何现有的 `sys.path.insert`（那是批 U-III）。
#    这一批结束时「旧的能跑的方式」与「新的能跑的方式」**同时成立**。

[build-system]
# setuptools 而不是 hatchling：这是一个 src-layout 的**纯 Python 零依赖**包，
# 不需要 hatchling 的任何特性；setuptools 是最无聊、最不会让人意外的选择，
# 且系统 python 本来就带着它。>=77 是因为下面用了 PEP 639 的 license 写法。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easyup-biga"
# 🔴 版本号不写 0.2.0。最后一个发布版是 v0.2.0（tag 存在），而 HEAD 远在它之后
#    ——写 0.2.0 等于宣称「这棵树就是那个 tag」，是假的。`.dev0` 是 PEP 440 的
#    开发版记号，明确表示「在 0.2.0 之后、尚未发布」。
#    ⚠️ 这个数字现在有两个出处（这里 + CHANGELOG.md），正是 L-3 的形状 ——
#    由 tests/test_packaging.py 钉住两者不矛盾。发版时两处一起改。
version = "0.5.1.dev0"
description = "Multi-Agent A 股短线决策辅助系统：不自动下单，产出证据可追溯、可回放的 Decision Card"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

# 🔴 零运行时依赖，这是**扫出来的不是抄来的**：AST 扫 src/ 与 skills/ 下全部
#    import，非 stdlib 的只有 easyup_biga 自己、以及 skills/*/scripts/ 里几个
#    互相 import 的兄弟模块。网络采集走 stdlib 的 urllib.request，没有 requests。
#    由 tests/test_packaging.py 的「声明零依赖 ⇔ 代码里真的没有第三方 import」
#    双向钉住 —— 哪天有人 `import requests` 忘了声明，那条会红。
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Private :: Do Not Upload",   # 这是决策辅助系统，不往 PyPI 发
]

# 开发工具链（批 U-IV）。**不是运行时依赖** —— 不装照样能跑整套系统，
# 装了才有 ruff/mypy：`pip install -e ".[dev]"`。
# 放 optional-dependencies 而不是 dependencies，是为了不破坏 U-II 那条
# 「声明 ⇔ 代码双向一致」的守卫：它查的是 [project.dependencies]，
# 而 ruff/mypy 谁也不会被包里的代码 import。
[project.optional-dependencies]
dev = ["ruff>=0.16", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/easyup168/easyup-biga"
Changelog = "https://github.com/easyup168/easyup-biga/blob/main/CHANGELOG.md"

# 🔴 没有 [project.scripts]，这是**裁定不是遗漏**（F 节原文点名了这一项）。
#    理由见 CHANGELOG「批 U-II」条目：tools/verify/*.py 里 8 个靠 __file__ 回溯
#    仓库根并挂 skills/，是**仓库绑定**的脚本；tools/ 本身没有 __init__.py，
#    不是 Python 包。要做成 console script 只有两条路，都不属于本批。

[tool.setuptools.packages.find]
where = ["src"]
# 显式白名单：src/ 下还有一个空的 data/ 目录（批 H-I 的 DEFAULT_DB_PATH 残留）。
# 它今天没有 __init__.py 所以 find 本来就不会收它，但判据不该依赖「它碰巧没有」。
include = ["easyup_biga*"]

# ─────────────────────────────────────────────────── lint / 类型检查（批 U-IV）
#
# 🔴 本批范围刻意收窄：**只加配置 + 拿一个基线，不承诺清空历史违规**。
#    一个跑了这么久的仓库第一次接 lint，目标若是「清零」，范围会失控到覆盖
#    全仓大部分文件 —— 而那跟 F 节本身（打包与依赖清理）已经不是同一件事。

[tool.ruff]
# 🔴 100 不是拍的，是量出来的。ruff 的 E501 按**显示列宽**算（中日韩字符占
#    两列），而本仓库大量中文注释 —— 用 ruff 默认的 88 会报 603 条，其中 63%
#    只是「这行中文注释比 44 个汉字长」。那种基线没人会看，
#    而一份没人看的 lint 配置比没有更糟：它训练人忽略输出。
#
#    实测全仓 36852 行的**列宽**分布：p50=43 / p90=79 / p98=88 / p99=91 /
#    p99.9=101 / max=114 ⇒ 仓库的事实约定就是 100 列左右。
#    取 100 ⇒ 超限 37 行（0.10%），一份看得完、改得动的清单。
#    ⚠️ 想收紧到 88 是一次独立的、范围明确的排版工作，不该藏在「接入 lint」里。
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 保守子集：E（pycodestyle 错误）/ F（pyflakes 真问题）/ I（import 排序）。
# 不开 B/UP/SIM/ANN 等 —— 那些引出的是「写法偏好」，属于另一件事。
select = ["E", "F", "I"]

[tool.mypy]
# 同样从宽松开始。目标不是「类型完备」，是拿到一个**能比较的基线**。
python_version = "3.12"
ignore_missing_imports = true      # 薄壳与 skills/ 脚本不是包，解析不到很正常
follow_imports = "silent"
# strict 系列**刻意不开** —— 开了就等于承诺清零，而本批明确不承诺。

[tool.pytest.ini_options]
# skills/ 是薄壳包根 —— 业务代码一律 `from _contract import ...`（壳会 re-export）。
# src/ 是真实实现根 —— 契约/存储/采集三层已迁至 easyup_biga.{domain,persistence,
# providers}（批 H-I）。壳自身也会用 __file__ 相对路径把 src/ 挂上，供非 pytest 的
# 真实运行路径（bin/biga-card 子进程、systemd-run）使用；这里显式列出 src/ 是让
# pytest 内**直接** `import easyup_biga.*` 也稳定可达，不依赖"先 import 过某个壳"。
pythonpath = ["skills", "src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# `--strict-markers` 在上面 ⇒ 标记必须先在这里注册，否则用了就报错。
markers = [
    "network: 这条测试真的需要出网（默认禁网，见 tests/conftest.py）",
    # P1-3：测试分层 —— 默认 pytest 必须在 clean clone / source ZIP 里 0 failed。
    # 带这些 marker 的测试须显式运行：pytest -m installed / -m live / -m git。
    "installed: 需要本机已安装 OpenClaw profile 或 bin/biga 二进制（换机器/ZIP 会跳）",
    "live: 需要在线运行时（OpenClaw gateway、真实 agent 执行环境）",
    "git: 需要当前目录是 git 仓库（source ZIP 里没有 .git）",
    "slow: 耗时较长的集成测试（可按需跳过）",
]
